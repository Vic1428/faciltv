<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FacilTV">
<title>FacilTV</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bg4:#22222e;--accent:#00d4ff;--accent2:#0099cc;--red:#ff4757;--green:#2ed573;--text:#e8e8f0;--muted:#6b6b80;--border:rgba(255,255,255,.08)}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#0d2233 0%,var(--bg) 70%);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column}
.login-screen.hidden{display:none}
.login-glow{position:absolute;top:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,255,.15),transparent 70%);pointer-events:none}
.login-box{position:relative;background:rgba(17,17,24,.9);border:1px solid rgba(0,212,255,.2);border-radius:20px;padding:2.5rem;width:100%;max-width:360px;backdrop-filter:blur(20px)}
.login-logo{font-family:'Rajdhani',sans-serif;font-size:3rem;font-weight:700;text-align:center;margin-bottom:.2rem;letter-spacing:.1em}
.login-logo span:first-child{color:var(--accent)}
.login-logo span:last-child{color:white}
.login-tagline{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:2rem;letter-spacing:.05em}
.login-field{position:relative;margin-bottom:.9rem}
.login-field input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem .8rem 2.8rem;color:var(--text);font-size:.9rem;font-family:'Inter',sans-serif;transition:.2s}
.login-field input:focus{outline:none;border-color:var(--accent);background:rgba(0,212,255,.05)}
.login-field .field-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem}
.login-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:10px;padding:.9rem;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:.4rem;letter-spacing:.05em;transition:.2s}
.login-btn:hover{opacity:.85;transform:translateY(-1px)}
.login-error{text-align:center;color:var(--red);font-size:.78rem;margin-top:.6rem;display:none}

/* APP LAYOUT */
.app{display:flex;height:100vh;overflow:hidden}
.app.hidden{display:none}

/* SIDEBAR - TV OPTIMIZED */
.tv-sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:.3s}
.tv-sidebar.collapsed{width:64px}
.sidebar-logo{padding:1.2rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.7rem;cursor:pointer}
.tv-logo-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;color:#000;flex-shrink:0}
.tv-logo-text{font-family:'Rajdhani',sans-serif;font-size:1.2rem;font-weight:700;color:white;letter-spacing:.08em;white-space:nowrap;overflow:hidden}
.tv-logo-text span{color:var(--accent)}
.tv-sidebar.collapsed .tv-logo-text{display:none}

.cats-list{flex:1;overflow-y:auto;padding:.5rem 0}
.cats-list::-webkit-scrollbar{width:3px}
.cats-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.cat-item{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;cursor:pointer;border-left:3px solid transparent;transition:.15s;font-size:.85rem;color:var(--muted);white-space:nowrap}
.cat-item:hover{background:rgba(0,212,255,.06);color:var(--text)}
.cat-item.active{background:rgba(0,212,255,.1);color:var(--accent);border-left-color:var(--accent)}
.cat-item svg{width:18px;height:18px;flex-shrink:0}
.cat-item .cat-count{margin-left:auto;background:rgba(0,212,255,.15);color:var(--accent);border-radius:10px;padding:.1rem .45rem;font-size:.65rem;font-weight:600}
.tv-sidebar.collapsed .cat-label,.tv-sidebar.collapsed .cat-count{display:none}
.tv-sidebar.collapsed .cat-item{justify-content:center}

.sidebar-user{padding:.8rem 1rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.6rem;cursor:pointer}
.sidebar-user:hover{background:rgba(255,255,255,.04)}
.user-av{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),#006699);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#000;flex-shrink:0}
.sidebar-user-info{overflow:hidden}
.sidebar-user-name{font-size:.78rem;font-weight:600;color:var(--text);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sidebar-user-plan{font-size:.62rem;color:var(--muted)}
.tv-sidebar.collapsed .sidebar-user-info{display:none}

/* CHANNEL LIST */
.channel-panel{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.channel-search{padding:.8rem;border-bottom:1px solid var(--border)}
.channel-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.55rem .8rem;color:var(--text);font-size:.82rem;font-family:'Inter',sans-serif}
.channel-search input:focus{outline:none;border-color:var(--accent)}
.channels-scroll{flex:1;overflow-y:auto}
.channels-scroll::-webkit-scrollbar{width:3px}
.channels-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.channel-item{display:flex;align-items:center;gap:.7rem;padding:.75rem .9rem;cursor:pointer;border-left:3px solid transparent;transition:.15s}
.channel-item:hover{background:rgba(255,255,255,.04)}
.channel-item.active{background:rgba(0,212,255,.08);border-left-color:var(--accent)}
.ch-logo{width:34px;height:34px;background:var(--bg4);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);flex-shrink:0;overflow:hidden}
.ch-logo img{width:100%;height:100%;object-fit:contain}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:.82rem;font-weight:500;color:var(--text);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.ch-cat{font-size:.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ch-live{width:6px;height:6px;background:var(--red);border-radius:50%;flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* PLAYER */
.player-panel{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.player-area{flex:1;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
.player-area video{width:100%;height:100%;object-fit:contain}
.player-placeholder{text-align:center;color:var(--muted)}
.player-placeholder .tv-icon{font-size:5rem;margin-bottom:1rem;opacity:.3}
.player-placeholder h3{font-family:'Rajdhani',sans-serif;font-size:1.4rem;color:var(--muted);margin-bottom:.4rem}
.player-placeholder p{font-size:.82rem}
.player-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 40%);opacity:0;transition:.3s;pointer-events:none}
.player-area:hover .player-overlay{opacity:1}
.player-controls{position:absolute;bottom:0;left:0;right:0;padding:1rem 1.4rem;display:flex;align-items:center;gap:.8rem;opacity:0;transition:.3s}
.player-area:hover .player-controls{opacity:1}
.now-playing-bar{background:var(--bg2);border-top:1px solid var(--border);padding:.7rem 1.2rem;display:flex;align-items:center;justify-content:space-between}
.np-info{display:flex;align-items:center;gap:.8rem}
.np-live{background:var(--red);color:white;font-size:.62rem;font-weight:700;padding:.15rem .5rem;border-radius:4px;letter-spacing:.08em}
.np-name{font-size:.88rem;font-weight:600}
.np-cat{font-size:.72rem;color:var(--muted)}
.np-actions{display:flex;gap:.6rem}
.ctrl-btn{background:rgba(255,255,255,.1);border:none;border-radius:7px;padding:.45rem .8rem;color:var(--text);cursor:pointer;font-size:.78rem;font-family:'Inter',sans-serif;transition:.2s}
.ctrl-btn:hover{background:rgba(255,255,255,.18)}
.ctrl-btn.active{background:var(--accent);color:#000;font-weight:600}
.no-url-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted)}
.no-url-msg h3{font-family:'Rajdhani',sans-serif;font-size:1.2rem;margin-bottom:.4rem}
.no-url-msg p{font-size:.78rem}

/* MOBILE */
.mobile-nav{display:none;background:var(--bg2);border-top:1px solid var(--border);padding:.5rem 0}
.mobile-nav-items{display:flex;justify-content:space-around}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.4rem .8rem;cursor:pointer;color:var(--muted);font-size:.62rem;border-radius:8px;transition:.15s}
.mobile-nav-item.active{color:var(--accent)}
.mobile-nav-item svg{width:20px;height:20px}

@media(max-width:900px){
.tv-sidebar{display:none}
.channel-panel{width:240px}
}
@media(max-width:600px){
.tv-sidebar,.channel-panel{display:none}
.player-panel{flex:1}
.mobile-nav{display:block}
.app{flex-direction:column}
.player-area{flex:1}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-glow"></div>
  <div class="login-box">
    <div class="login-logo"><span>FACIL</span><span>TV</span></div>
    <div class="login-tagline">Tu entretenimiento, sin límites</div>
    <div class="login-field">
      <span class="field-icon">👤</span>
      <input type="text" id="appUser" placeholder="Usuario" autocomplete="off">
    </div>
    <div class="login-field">
      <span class="field-icon">🔒</span>
      <input type="password" id="appPass" placeholder="Contraseña">
    </div>
    <button class="login-btn" onclick="appLogin()">▶ INGRESAR</button>
    <div class="login-error" id="appLoginError">Usuario o contraseña incorrectos</div>
    <div style="margin-top:1.2rem;font-size:.7rem;color:var(--muted);text-align:center">Demo: mariag / 1234</div>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">

  <!-- SIDEBAR CATEGORÍAS -->
  <div class="tv-sidebar" id="tvSidebar">
    <div class="sidebar-logo" onclick="toggleSidebar()">
      <div class="tv-logo-mark">F</div>
      <div class="tv-logo-text">FACIL<span>TV</span></div>
    </div>
    <div class="cats-list" id="catsList"></div>
    <div class="sidebar-user" onclick="appLogout()">
      <div class="user-av" id="userAv">?</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="userDisplayName">Usuario</div>
        <div class="sidebar-user-plan" id="userDisplayPlan">— Cerrar sesión</div>
      </div>
    </div>
  </div>

  <!-- LISTA DE CANALES -->
  <div class="channel-panel" id="channelPanel">
    <div class="channel-search">
      <input placeholder="🔍 Buscar canal..." id="chSearch" oninput="renderChannelList()">
    </div>
    <div class="channels-scroll" id="channelsList"></div>
  </div>

  <!-- PLAYER -->
  <div class="player-panel">
    <div class="player-area" id="playerArea">
      <div class="player-placeholder" id="playerPlaceholder">
        <div class="tv-icon">📺</div>
        <h3>Bienvenido a FacilTV</h3>
        <p>Selecciona un canal para comenzar</p>
      </div>
      <video id="videoPlayer" style="display:none" controls autoplay></video>
      <div class="no-url-msg" id="noUrlMsg" style="display:none">
        <h3>Sin señal</h3>
        <p>Este canal no tiene URL configurada</p>
      </div>
    </div>
    <div class="now-playing-bar" id="nowPlayingBar" style="display:none">
      <div class="np-info">
        <span class="np-live">EN VIVO</span>
        <div>
          <div class="np-name" id="npName">—</div>
          <div class="np-cat" id="npCat">—</div>
        </div>
      </div>
      <div class="np-actions">
        <button class="ctrl-btn" onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
        <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
        <button class="ctrl-btn" onclick="prevChannel()">⏮</button>
        <button class="ctrl-btn" onclick="nextChannel()">⏭</button>
      </div>
    </div>
  </div>

  <!-- MOBILE NAV -->
  <div class="mobile-nav" id="mobileNav">
    <div class="mobile-nav-items">
      <div class="mobile-nav-item active" onclick="mobileShowPanel('channels',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        Canales
      </div>
      <div class="mobile-nav-item" onclick="mobileShowPanel('player',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        Ver TV
      </div>
      <div class="mobile-nav-item" onclick="appLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Salir
      </div>
    </div>
  </div>
</div>

var catIcons={all:'📺',noticias:'📰',deportes:'⚽',entretenimiento:'🎭',peliculas:'🎬',series:'📽',infantil:'🧸',musica:'🎵',otro:'📡'};

function g(id){return document.getElementById(id)}

function appLogin(){
  var u=g('appUser').value.trim();var p=g('appPass').value.trim();
  // Check against dashboard users
  var users=JSON.parse(localStorage.getItem('ftv_users')||'[]');
  var found=users.find(x=>x.user===u&&x.pass===p&&x.status!=='suspended');
  // Demo fallback
  if(!found&&u==='mariag'&&p==='1234')found={user:'mariag',name:'María González',plan:'Mensual',expiry:'2025-12-31',status:'active'};
  if(found){
    appState.user=found;
    // Load channels from dashboard
    var ch=JSON.parse(localStorage.getItem('ftv_channels')||'[]');
    appState.channels=ch.length?ch.filter(c=>c.status==='active'):demoChannels;
    g('loginScreen').classList.add('hidden');
    g('app').classList.remove('hidden');
    g('userAv').textContent=found.name?found.name[0].toUpperCase():'U';
    g('userDisplayName').textContent=found.name||found.user;
    g('userDisplayPlan').textContent=(found.plan||'')+(found.expiry?' · vence '+found.expiry:'');
    renderCats();renderChannelList();
  } else {
    g('appLoginError').style.display='block';
    setTimeout(()=>g('appLoginError').style.display='none',3000);
  }
}
g('appPass').addEventListener('keydown',e=>{if(e.key==='Enter')appLogin()});

function appLogout(){
  g('loginScreen').classList.remove('hidden');
  g('app').classList.add('hidden');
  g('videoPlayer').src='';
  appState.user=null;appState.currentChannel=null;
}

function toggleSidebar(){g('tvSidebar').classList.toggle('collapsed')}

function renderCats(){
  var cats=['all',...new Set(appState.channels.map(c=>c.cat))];
  g('catsList').innerHTML=cats.map(cat=>{
    var count=cat==='all'?appState.channels.length:appState.channels.filter(c=>c.cat===cat).length;
    var label=cat==='all'?'Todos':cat.charAt(0).toUpperCase()+cat.slice(1);
    return`<div class="cat-item ${cat===appState.currentCat?'active':''}" onclick="selectCat('${cat}')">
      <span style="font-size:1rem">${catIcons[cat]||'📺'}</span>
      <span class="cat-label">${label}</span>
      <span class="cat-count">${count}</span>
    </div>`;
  }).join('');
}

function selectCat(cat){
  appState.currentCat=cat;
  renderCats();renderChannelList();
}

function renderChannelList(){
  var q=g('chSearch').value.toLowerCase();
  var list=appState.channels.filter(c=>{
    var mQ=!q||c.name.toLowerCase().includes(q);
    var mC=appState.currentCat==='all'||c.cat===appState.currentCat;
    return mQ&&mC;
  }).sort((a,b)=>a.order-b.order);
  g('channelsList').innerHTML=list.length?list.map(c=>`
    <div class="channel-item ${appState.currentChannel&&appState.currentChannel.id===c.id?'active':''}" onclick="playChannel('${c.id}')">
      <div class="ch-logo">${c.logo?`<img src="${c.logo}" onerror="this.style.display='none'">`:(catIcons[c.cat]||'📺')}</div>
      <div class="ch-info">
        <div class="ch-name">${c.name}</div>
        <div class="ch-cat">${c.cat}</div>
      </div>
      <div class="ch-live"></div>
    </div>`).join(''):'<div style="text-align:center;padding:2rem;color:var(--muted);font-size:.82rem">Sin canales</div>';
}

function playChannel(id){
  var ch=appState.channels.find(c=>c.id===id);if(!ch)return;
  appState.currentChannel=ch;
  appState.currentIdx=appState.channels.indexOf(ch);
  renderChannelList();
  g('playerPlaceholder').style.display='none';
  g('noUrlMsg').style.display='none';
  g('nowPlayingBar').style.display='flex';
  g('npName').textContent=ch.name;
  g('npCat').textContent=ch.cat.toUpperCase();
  var vid=g('videoPlayer');
  if(ch.url){
    vid.style.display='block';
    // Try HLS if available
    if(window.Hls&&Hls.isSupported()&&ch.url.includes('.m3u8')){
      var hls=new Hls();hls.loadSource(ch.url);hls.attachMedia(vid);
    } else {
      vid.src=ch.url;
    }
    vid.play().catch(()=>{});
  } else {
    vid.style.display='none';
    g('noUrlMsg').style.display='flex';
  }
  // Mobile: switch to player
  if(window.innerWidth<=600)mobileShowPanel('player',document.querySelectorAll('.mobile-nav-item')[1]);
}

function prevChannel(){
  var list=appState.channels;
  if(!list.length)return;
  var idx=(appState.currentIdx-1+list.length)%list.length;
  playChannel(list[idx].id);
}
function nextChannel(){
  var list=appState.channels;
  if(!list.length)return;
  var idx=(appState.currentIdx+1)%list.length;
  playChannel(list[idx].id);
}
function toggleFullscreen(){
  var pa=g('playerArea');
  if(!document.fullscreenElement)pa.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
function toggleMute(){
  var v=g('videoPlayer');v.muted=!v.muted;
  g('muteBtn').textContent=v.muted?'🔇':'🔊';
}

// KEYBOARD CONTROL (TV remotes)
document.addEventListener('keydown',function(e){
  if(!appState.user)return;
  if(e.key==='ArrowRight'||e.key==='MediaTrackNext')nextChannel();
  if(e.key==='ArrowLeft'||e.key==='MediaTrackPrevious')prevChannel();
  if(e.key==='f'||e.key==='F')toggleFullscreen();
  if(e.key==='m'||e.key==='M')toggleMute();
});

function mobileShowPanel(panel,el){
  document.querySelectorAll('.mobile-nav-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  var cp=g('channelPanel');var pp=document.querySelector('.player-panel');
  if(panel==='channels'){cp.style.display='flex';pp.style.display='none'}
  else{cp.style.display='none';pp.style.display='flex'}
}
</script>
